media:
  - name: images
    input: src/assets/images
    output: /assets/images
  - name: documents
    input: src/assets/documents
    output: /assets/documents

content:
  - name: home
    label: "Accueil"
    type: file
    path: src/home/index.njk
    fields:
      - { name: title, label: "Titre (onglet navigateur)", type: string }

  - name: presentation
    label: "Présentation"
    type: file
    path: src/presentation/index.md
    fields:
      - { name: title, label: "Titre", type: string }
      - { name: showBureau, label: "Afficher le bureau", type: boolean, default: true }
      - { name: body, label: "Texte de présentation", type: rich-text }

  - name: partenariats
    label: "Partenariats"
    type: file
    path: src/partenariats/index.md
    fields:
      - { name: title, label: "Titre", type: string }
      - { name: showPartners, label: "Afficher les partenaires", type: boolean, default: true }
      - { name: body, label: "Texte de présentation", type: rich-text }

  - name: contact
    label: "Contact / Adhésion"
    type: file
    path: src/contact/index.md
    fields:
      - { name: title, label: "Titre", type: string }
      - { name: instagram, label: "Lien Instagram", type: string, required: false }
      - { name: linkedin, label: "Lien LinkedIn", type: string, required: false }
      - { name: body, label: "Texte", type: rich-text }

  - name: events
    label: "Événements"
    type: collection
    path: src/events
    filter:
      path: "events.json"
      exclude: true
    view:
      fields: [title, date]
      sort: date
      sortDirection: desc
    fields:
      - { name: title, label: "Titre", type: string }
      - { name: date, label: "Date", type: date }
      - { name: description, label: "Description", type: text }
      - { name: link, label: "Lien (inscription, etc.)", type: string, required: false }

  - name: chroniques
    label: "Chroniques"
    type: collection
    path: src/chroniques
    filter:
      path: "chroniques.json"
      exclude: true
    view:
      fields: [title, category]
    fields:
      - { name: title, label: "Titre", type: string }
      - name: category
        label: "Catégorie"
        type: select
        options:
          values: ["Cours", "Fiches", "Annales", "Autre"]
      - { name: description, label: "Description", type: text, required: false }
      - { name: file, label: "Fichier", type: file, media: documents }

  - name: bureau
    label: "Bureau"
    type: collection
    path: src/bureau
    filter:
      path: "bureau.json"
      exclude: true
    view:
      fields: [name, role]
      sort: order
    fields:
      - { name: name, label: "Nom", type: string }
      - { name: role, label: "Rôle", type: string }
      - { name: order, label: "Ordre d'affichage", type: number, default: 1 }
      - { name: photo, label: "Photo", type: image, media: images, required: false }

  - name: partenaires
    label: "Partenaires"
    type: collection
    path: src/partenaires
    filter:
      path: "partenaires.json"
      exclude: true
    view:
      fields: [name]
      sort: order
    fields:
      - { name: name, label: "Nom", type: string }
      - { name: logo, label: "Logo", type: image, media: images, required: false }
      - { name: link, label: "Lien (site web)", type: string, required: false }
      - { name: order, label: "Ordre d'affichage", type: number, default: 1 }

  - name: boutique
    label: "Boutique"
    type: collection
    path: src/boutique
    filter:
      path: "boutique.json"
      exclude: true
    view:
      fields: [title, price]
      sort: order
    fields:
      - { name: title, label: "Nom du produit", type: string }
      - { name: description, label: "Description", type: text, required: false }
      - { name: price, label: "Prix (ex: 25 €)", type: string }
      - { name: photo, label: "Photo", type: image, media: images, required: false }
      - name: paymentLink
        label: "Lien de paiement Stripe"
        type: string
        required: false
        description: "Collez ici le lien créé dans Stripe (Payment Links) pour ce produit."
      - { name: order, label: "Ordre d'affichage", type: number, default: 1 }
